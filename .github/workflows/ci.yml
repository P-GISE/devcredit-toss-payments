name: Deployment preparation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  verify:
    needs: ["security"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_VERSION: ci
      APP_PORT: 3504
      POSTGRES_PASSWORD: synthetic-ci-database
      DATABASE_URL: postgresql://devcredit:synthetic-ci-database@db:5432/devcredit
      NEXTAUTH_SECRET: synthetic-session-secret-for-ci-only
      API_KEY_PEPPER: synthetic-api-pepper-for-ci-only-123
      APP_URL: https://devcredit.example.invalid
      NEXTAUTH_URL: https://devcredit.example.invalid
      TOSS_CLIENT_KEY: test_ck_synthetic_not_a_real_key
      TOSS_SECRET_KEY: test_sk_synthetic_not_a_real_key
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify event deployment workflow regressions
        run: python -m unittest discover -s scripts/deploy -p test_event_workflow.py -v
      - name: Runtime image security gate regressions
        run: python -m unittest discover -s scripts/security -p 'test_*.py' -v
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: docker compose -f compose.production.yaml --profile tools build --build-arg REVISION_SHA="$GITHUB_SHA"
      - name: Verify musl native runtime and Prisma tools without external requests
        run: |
          docker run --rm --network none --entrypoint node devcredit:ci -e 'require("sharp")({create:{width:2,height:2,channels:4,background:"#000000"}}).resize(1,1).png().toBuffer().then(b=>{if(!b.length)process.exit(1)}).catch(()=>process.exit(1))'
          docker run --rm --network none --entrypoint sh devcredit-tools:ci -ec 'test -s /etc/alpine-release; openssl version >/dev/null; npx --no-install prisma --version >/dev/null'
      - name: Gate the standalone app image OS and Node libraries
        run: |
          docker run --rm --network none --entrypoint sh devcredit:ci -ec 'test -s /etc/alpine-release; for tool in npm npx yarn yarnpkg; do test -z "$(command -v "$tool")"; done; node --version >/dev/null'
          image_id=$(docker image inspect devcredit:ci --format '{{.Id}}')
          bash scripts/security/scan-image.sh "$image_id"
      - name: Missing settings must stop the production server
        run: |
          set +e
          timeout 20s docker run --rm --name devcredit-invalid devcredit:ci
          result=$?
          docker rm -f devcredit-invalid >/dev/null 2>&1 || true
          set -e
          if [ "$result" -ne 1 ]; then
            echo 'Server unexpectedly accepted missing configuration'
            exit 1
          fi
      - name: Initialize only the disposable CI database
        run: |
          docker compose -f compose.production.yaml up -d --wait db
          docker compose -f compose.production.yaml --profile tools run --rm migrate
          docker compose -f compose.production.yaml --profile tools run --rm migrate npx prisma db seed
          docker compose -f compose.production.yaml up -d --wait app
      - run: node scripts/smoke.mjs
      - name: Remove only disposable CI containers and data
        if: always()
        run: docker compose -f compose.production.yaml --profile tools down -v
      - name: Package verified immutable image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(docker image inspect devcredit:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag devcredit:ci devcredit:$GITHUB_SHA
          mkdir -p release
          docker save devcredit:$GITHUB_SHA | gzip > release/image.tar.gz
          (cd release && sha256sum image.tar.gz > image.sha256)
          echo "$GITHUB_SHA" > release/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: five-sites-app-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Package verified tools image for manual initial database setup only
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(docker image inspect devcredit-tools:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker tag devcredit-tools:ci devcredit-tools:$GITHUB_SHA
          mkdir -p tools-release
          docker save devcredit-tools:$GITHUB_SHA | gzip > tools-release/image.tar.gz
          (cd tools-release && sha256sum image.tar.gz > image.sha256)
          echo "$GITHUB_SHA" > tools-release/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push'
        with:
          name: devcredit-tools-${{ github.sha }}
          path: tools-release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
